apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: nour292/user-service:latest
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5000
